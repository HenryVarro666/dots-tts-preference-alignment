# dpo_onmanifold.yaml — 臂 X6a：全参 DPO + 多目标奖励，但只用「winner 更 on-manifold」的偏好子集
# 为什么存在: 仿 dpo_multiobj_fullparam.yaml，唯一变量是 pairs_file 换成 on-manifold 过滤后的子集
#            （pairs/filter_pairs_by_likelihood.py 产出）。训练超参全同 ⇒ 任何差异只来自「winner 选得更贴流形」。
# 对实验意义: 测「只选 on-manifold winner 能否救 DPO-FM」——若 over base 改善=退化源于 winner off-manifold(数据侧可修)；
#            若仍不改善=负面结论收紧到「DPO-FM 似然代理本身的边界」，并据此给「该怎么做」。

output_dir: ./alignment/out/dpo_onmanifold

# --- 训练（仿 dots.tts train schema） ---
learning_rate: 1.0e-5
max_train_steps: 600    # 防过拟合：1500(8ep)→600(~3ep)
warmup_steps: 50
gradient_accumulation_steps: 4
micro_batch_size: 1
grad_clip_norm: 1.0
weight_decay: 0.01
log_interval: 10
save_interval: 100000  # 只在末尾存一次（save_pretrained 每次写整模型~数GB）
num_workers: 2

# --- 偏好对齐（本实验新增） ---
dpo:
  base_ckpt: rednote-hilab/dots.tts-base
  beta: 0.5                       # 0.3->0.5 再放大 DPO 梯度（anchor 仍压 fm_w）
  lambda_sft: 0.2             # 中间档：0.5→0.2 让 DPO 有空间拉开 margin（仍防爆）
  pairs_file: ./pairs/out/pairs_onmanifold.jsonl   # 唯一改动：on-manifold 过滤后的子集
  reward_weights: { wer: 0.4, sim: 0.3, utmos: 0.3 }   # 记录用（实际奖励在 reward/ 阶段算）
  lora: { enabled: false }        # 全参；A6000 档改 dpo_lora.yaml

# --- 分布式（2×H100：DeepSpeed ZeRO-2；用 accelerate launch 时由 accelerate config 提供） ---
# accelerate config 建议: deepspeed zero_stage=2, bf16, 2 GPU
