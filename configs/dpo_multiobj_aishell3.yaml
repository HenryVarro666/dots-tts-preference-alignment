# dpo_multiobj_aishell3.yaml — 多语种 scale-up：AISHELL-3(ZH, 多说话人) 上的全参 DPO + 多目标奖励
# 仿 dpo_multiobj_fullparam.yaml，仅改 output_dir + dpo.pairs_file 指向 AISHELL-3 语料产物（管线代码不动）。
# 为什么换 AISHELL-3: (1) 多说话人 → SIM 变可判别（解 LJSpeech 单说话人 SIM 近-ceiling）；
#                    (2) 加中文 → 检验头条 claim 跨语言泛化。ZH 的 WER 实为 CER（score_wer 已按 lang 字段自动走 funasr/Paraformer + jiwer.cer）。
# 对实验意义: 中文 + 多说话人是「泛化 + SIM 可判别 + 规模>188 对」三重证据的核心一臂。

output_dir: ./alignment/out/dpo_multiobj_aishell3

# --- 训练（仿 dots.tts train schema） ---
learning_rate: 1.0e-5
max_train_steps: 600    # 防过拟合：1500(8ep)→600(~3ep)
warmup_steps: 50
gradient_accumulation_steps: 4
micro_batch_size: 1
grad_clip_norm: 1.0
weight_decay: 0.01
log_interval: 10
save_interval: 100000  # 只在末尾存一次（save_pretrained 每次写整模型~数GB）
num_workers: 2

# --- 偏好对齐（本实验新增） ---
dpo:
  base_ckpt: rednote-hilab/dots.tts-base
  beta: 0.5                       # 0.3->0.5 再放大 DPO 梯度（anchor 仍压 fm_w）
  lambda_sft: 0.2             # 中间档：0.5→0.2 让 DPO 有空间拉开 margin（仍防爆）
  pairs_file: ./pairs/out/pairs_best_worst_aishell3.jsonl   # AISHELL-3 专属偏好对（run_multilingual.md 用 --out 产出）
  reward_weights: { wer: 0.4, sim: 0.3, utmos: 0.3 }   # 记录用（ZH 的 wer 项实为 CER；实际奖励在 reward/ 阶段算）
  lora: { enabled: false }        # 全参；A6000 档改 dpo_lora.yaml

# --- 分布式（2×H100：DeepSpeed ZeRO-2；用 accelerate launch 时由 accelerate config 提供） ---
# accelerate config 建议: deepspeed zero_stage=2, bf16, 2 GPU
