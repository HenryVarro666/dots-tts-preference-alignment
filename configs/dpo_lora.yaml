# dpo_lora.yaml — A6000 档默认：LoRA DPO（ref = 关掉适配器的同一模型，省一份显存）
# 为什么: 2×A6000(48GB) 全参 DPO 偏紧；LoRA 只训适配器、ref=disable_adapter()，显存大降。
# 对实验意义: 「2 张卡也能跑」的可行性保障；同时作 LoRA vs full-param 消融。

output_dir: ./alignment/out/dpo_multiobj_lora

learning_rate: 2.0e-4              # LoRA 通常用更大 LR
max_train_steps: 2000
warmup_steps: 50
gradient_accumulation_steps: 8
micro_batch_size: 1
grad_clip_norm: 1.0
log_interval: 10
save_interval: 500

dpo:
  base_ckpt: rednote-hilab/dots.tts-base
  beta: 0.1
  lambda_sft: 0.1
  pairs_file: ./pairs/out/pairs_best_worst.jsonl
  reward_weights: { wer: 0.4, sim: 0.3, utmos: 0.3 }
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    # target_modules 名称需对照 dots.tts dit.py / Qwen2 实际层名
    target_modules: [to_q, to_k, to_v, to_out, fc1, fc2, q_proj, k_proj, v_proj, o_proj]
