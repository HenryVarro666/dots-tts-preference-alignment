<svg viewBox="0 0 360 270" width="720" height="540" xmlns="http://www.w3.org/2000/svg" role="img"><style>.f-bg{fill:#1f2328}.f-node{fill:#2b3036;stroke:#4a5058}.f-hl{fill:#2c3c4c;stroke:#8cb8de}.f-fillhl{fill:#8cb8de}.f-fillsoft{fill:#2c3c4c}.f-bar{fill:#4a5058}.f-bar2{fill:#7d838a}.f-ln{stroke:#7d838a;fill:none}.f-lnhl{stroke:#8cb8de;fill:none}.f-lnink{stroke:#e6e6e6;fill:none}.f-lnrule{stroke:#4a5058;fill:none}.f-head{fill:#7d838a}.f-headhl{fill:#8cb8de}.f-t{fill:#e6e6e6}.f-m{fill:#9aa0a6}.f-h{fill:#8cb8de}.f-onhl{fill:#111418}.f-dotink{fill:#e6e6e6}.f-dotm{fill:#9aa0a6}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Noto Sans CJK SC', sans-serif}</style><title>When likelihood disagrees with quality</title><desc>Held-out WER: base 0.11, open-SOAR 0.09, SFT on reward winners 0.56, DPO-FM 0.89. Reward and model likelihood are anti-correlated, Spearman rho -0.22.</desc><rect x="0" y="0" width="360" height="270" rx="8" class="f-bg"/><text x="18" y="30" font-size="15" class="f-m" text-anchor="start">held-out WER, lower is better (n = 100)</text><rect x="39" y="161.151" width="46" height="14.8494" rx="3" class="f-bar2" stroke-width="0"/><text x="62" y="154.151" font-size="15" class="f-m" text-anchor="middle">0.11</text><text x="62" y="196" font-size="14.5" class="f-t" text-anchor="middle">base</text><rect x="118" y="163.537" width="46" height="12.4629" rx="3" class="f-fillhl" stroke-width="0"/><text x="141" y="156.537" font-size="15" class="f-h" text-anchor="middle" font-weight="600">0.09</text><text x="141" y="196" font-size="14.5" class="f-h" text-anchor="middle" font-weight="600">open-SOAR</text><rect x="197" y="102.283" width="46" height="73.7169" rx="3" class="f-bar" stroke-width="0"/><text x="220" y="95.2831" font-size="15" class="f-m" text-anchor="middle">0.56</text><text x="220" y="196" font-size="14.5" class="f-t" text-anchor="middle">SFT</text><rect x="276" y="58" width="46" height="118" rx="3" class="f-bar" stroke-width="0"/><text x="299" y="51" font-size="15" class="f-m" text-anchor="middle">0.89</text><text x="299" y="196" font-size="14.5" class="f-t" text-anchor="middle">DPO-FM</text><path d="M24 176 H336" class="f-lnrule" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="236" font-size="17" class="f-h" text-anchor="middle" font-weight="600">reward vs. likelihood: ρ = −0.22</text><text x="180" y="257" font-size="12.5" class="f-m" text-anchor="middle">the reward favours the sample the model finds less likely</text></svg>
